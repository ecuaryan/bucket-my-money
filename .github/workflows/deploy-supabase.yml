# Apply hosted Supabase migrations and Edge Functions after CI passes on main.
# See README.md § Production deploy automation for one-time secret setup.
#
# FAST_DEPLOY (TEMPORARY, off by default): while the repository Actions variable
# FAST_DEPLOY is 'true', a merge to main deploys immediately instead of waiting
# for the whole CI run on main (PR CI already passed on the same change). CI still
# runs in parallel; a bad merge reaches production before its main-CI result.
# Only for a single-user app during active work. Turn it OFF when done:
#   gh variable delete FAST_DEPLOY

name: Deploy Supabase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Only deploys while the FAST_DEPLOY variable is 'true'; otherwise this run is
  # skipped and the workflow_run trigger above does the (gated) deploy.
  push:
    branches: [main]
  # Manual run (Actions → Deploy Supabase → Run workflow, branch: main), e.g.
  # when a deploy was skipped. Requires a green CI run for the commit.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: migrations + Edge Functions
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && vars.FAST_DEPLOY != 'true') ||
      (github.event_name == 'push' && vars.FAST_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Warn that fast deploy is on
        if: github.event_name == 'push'
        run: echo "::warning::FAST_DEPLOY is ON - deploying without waiting for CI on main. Turn it off when done:  gh variable delete FAST_DEPLOY"

      # A manual run skips the workflow_run gate, so check it ourselves: never
      # deploy a commit whose CI did not pass.
      - name: Require green CI for this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA — wait for CI (or re-run it) before deploying manually."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply SQL migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --use-api bundles on Supabase's servers instead of pulling the
      # edge-runtime Docker image on the runner: setup-cli pins the CLI to
      # ghcr.io only, which intermittently answers `toomanyrequests` and used
      # to fail this step (and leave functions behind the migrations).
      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The hosted schema may now be behind main; make the failure loud.
      # Reuses one open issue per incident stream instead of piling up new ones.
      - name: Notify on deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          title="Deploy Supabase failed on main"
          printf '%s\n' \
            "Production Supabase deploy failed for \`$HEAD_SHA\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "The hosted schema/functions may be behind \`main\`. Re-run the workflow after fixing; manual \`supabase link\` + \`db push\` is the emergency fallback (see CONTRIBUTING § Deploying backend changes)." \
            > /tmp/issue-body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue-body.md
          fi