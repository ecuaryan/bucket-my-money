name: CI

# Fast when safe, thorough when needed:
# - `detect changed scope` skips heavy db/e2e work for docs-only or UI-only diffs.
# - Playwright browsers are cached; full install --with-deps only on cache miss.
# - Local Supabase starts a minimal service set (see SUPABASE_CI_EXCLUDE).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # ghcr.io pulls for the Supabase Postgres image (see scripts/ci-supabase-start.sh).
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Smoke/db tests need Postgres, Auth, REST, and Realtime — not Studio, Storage, etc.
  SUPABASE_CI_EXCLUDE: studio,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector

jobs:
  changes:
    name: detect changed scope
    runs-on: ubuntu-latest
    outputs:
      run_db: ${{ steps.scope.outputs.run_db }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run_db=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$HEAD" | node scripts/ciChangedScope.mjs >> "$GITHUB_OUTPUT"

  unit:
    name: lint, unit test, build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` validates the dependency tree but not the project's own version
      # field, so a bump to package.json without `npm install --package-lock-only`
      # would otherwise slip through (see CONTRIBUTING § Bump version).
      - name: Check lockfile version in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK_ROOT=$(node -p "require('./package-lock.json').version")
          LOCK_PKG=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$PKG" != "$LOCK_ROOT" ] || [ "$PKG" != "$LOCK_PKG" ]; then
            echo "::error::package-lock.json version ($LOCK_ROOT/$LOCK_PKG) out of sync with package.json ($PKG). Run: npm install --package-lock-only"
            exit 1
          fi
          echo "Lockfile version in sync: $PKG"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Log build version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Built ${VERSION} (${GITHUB_SHA:0:7})"

  db:
    name: database RLS tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Skip (no db-relevant files changed)
        if: needs.changes.outputs.run_db == 'false'
        run: echo "Skipping database RLS tests — change set cannot affect Postgres RLS or RPCs."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_db != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_db != 'false'
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.run_db != 'false'
        with:
          version: 2.105.0

      - name: Install dependencies
        if: needs.changes.outputs.run_db != 'false'
        run: npm ci

      # Authenticated pulls from ghcr.io have their own rate limit; anonymous
      # pulls share a per-IP one that can be exhausted for hours.
      - name: Log in to ghcr.io
        if: needs.changes.outputs.run_db != 'false'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase
        if: needs.changes.outputs.run_db != 'false'
        # Retries with backoff: image pulls are intermittently rate-limited.
        run: scripts/ci-supabase-start.sh "${{ env.SUPABASE_CI_EXCLUDE }}"

      - name: Database RLS tests
        if: needs.changes.outputs.run_db != 'false'
        run: npm run test:db
        env:
          CI: true
          SKIP_DB_RESET: '1'

  e2e:
    name: e2e smoke tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    # e2e exercises the WebAuthn biometric-login edge functions, so this job
    # keeps edge-runtime (the shared default excludes it for the db job's speed).
    env:
      SUPABASE_CI_EXCLUDE: studio,storage-api,imgproxy,inbucket,logflare,vector

    steps:
      - name: Skip (docs-only change)
        if: needs.changes.outputs.run_e2e == 'false'
        run: echo "Skipping e2e smoke tests — docs-only change."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_e2e != 'false'
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.run_e2e != 'false'
        with:
          version: 2.105.0

      - name: Install dependencies
        if: needs.changes.outputs.run_e2e != 'false'
        run: npm ci

      - uses: actions/cache@v4
        if: needs.changes.outputs.run_e2e != 'false'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browser
        if: needs.changes.outputs.run_e2e != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # Authenticated pulls from ghcr.io have their own rate limit; anonymous
      # pulls share a per-IP one that can be exhausted for hours.
      - name: Log in to ghcr.io
        if: needs.changes.outputs.run_e2e != 'false'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase
        if: needs.changes.outputs.run_e2e != 'false'
        # Retries with backoff: image pulls are intermittently rate-limited.
        run: scripts/ci-supabase-start.sh "${{ env.SUPABASE_CI_EXCLUDE }}"

      - name: E2E smoke tests
        if: needs.changes.outputs.run_e2e != 'false'
        run: npm run test:e2e
        env:
          CI: true
          SKIP_DB_RESET: '1'
