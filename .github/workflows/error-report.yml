name: Error report

# Daily nudge about the app's anonymous crash reports (table client_errors,
# migration 121). Posts yesterday's (UTC) counts as a comment on the open
# "Error report" issue this workflow opened, or opens one; GitHub emails the
# owner. Numbers only: the reports themselves stay private, in the Supabase
# dashboard. Quiet days post nothing. Details: docs/MAINTENANCE.md § Error reports.
on:
  schedule:
    - cron: '7 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: error-report
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The backup's connection secret, passed through the environment (never
      # the command line); query.sql runs in a read-only transaction.
      - name: Count yesterday's reports
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          counts=$(docker run --rm -i -e BACKUP_DATABASE_URL postgres:17 \
            sh -c 'psql "$BACKUP_DATABASE_URL" -X -q -At -v ON_ERROR_STOP=1 -f -' \
            < scripts/error-report/query.sql)
          if ! [[ "$counts" =~ ^[0-9]+\|[0-9]+\|[0-9]+$ ]]; then
            echo "::error::Unexpected query output."
            exit 1
          fi
          echo "COUNTS=$counts" >> "$GITHUB_ENV"

      - name: Post to the Error report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS='|' read -r reports errors fresh <<< "$COUNTS"
          day=$(date -u -d yesterday +%F)
          if [ "$reports" -eq 0 ]; then
            echo "No errors reported on $day."
            exit 0
          fi
          plural() { [ "$1" -eq 1 ] && echo "$2" || echo "$2s"; }
          printf '%s\n' \
            "**$day:** $reports $(plural "$reports" report) of $errors $(plural "$errors" error), $fresh new." \
            "" \
            "Read them in the Supabase dashboard: Table Editor → \`client_errors\` (filter \`day\` = $day)." \
            > "$RUNNER_TEMP/report.md"
          title="Error report"
          # Only an issue this workflow opened: anyone can open one with this title.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
